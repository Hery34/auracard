    <!-- anneau vert + bande haute -->
    <circle cx="461" cy="218" r="166" stroke="#1ABC8C"/>
    <line x1="152" y1="308" x2="350" y2="110" stroke="#1ABC8C"/>
  </g>
  <!-- intérieur de l'anneau -->
  <circle cx="461" cy="218" r="135" fill="#111111"/>
